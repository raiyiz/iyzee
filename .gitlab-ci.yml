image: ghcr.io/astral-sh/uv:0.12.22-python3.14-trixie

variables:
  # uv's download cache lives inside the project so GitLab can keep it between jobs.
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy

default:
  interruptible: true  # a newer push cancels the pipelines it makes obsolete
  timeout: 30m         # the test job takes minutes; a hung one must not run for an hour
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test:
  script: [scripts/ci.sh test]

lint:
  script: [scripts/ci.sh lint]

typecheck:
  script: [scripts/ci.sh typecheck]

doc-links:
  script: [scripts/ci.sh doc-links]

docs-index:
  script: [scripts/ci.sh docs-index]
  artifacts:
    paths: [docs/code-index.json]
    expire_in: 1 day

docs:
  needs: [docs-index]
  cache: []  # the Typst image has no uv; nothing to cache
  variables:
    DOCS_INDEX_PREBUILT: "1"
  image:
    name: ghcr.io/typst/typst:0.15.1
    entrypoint: [""]
  script: [scripts/ci.sh docs]
  artifacts:
    name: iyzee-documentation
    paths: [build/docs/*.pdf]
    expire_in: 30 days
