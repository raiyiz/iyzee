[project]
name = "iyzee"
version = "0.1.0"
description = "Lab instrument control and noise-measurement TUI"
readme = "README.md"
authors = [
    { name = "ↄǝsƃ", email = "ʇǝu˙oǝʇsod@ınƃ" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "platformdirs>=4.0",
    "pyvisa>=1.16.2",
    "pyvisa-py>=0.8.1",
    "requests>=2.34.2",
    "textual>=8.2.8",
    "textual-plotext>=1.0.1",
]

[project.scripts]
iyz = "iyzee.tui.app:run"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "hardware: talks to real instruments; skipped unless --hardware is passed (everything under tests/hardware is marked automatically)",
    "actuates: also changes instrument state (opens the shutter, runs sweeps, moves the laser); needs --hardware-actuate as well",
    "mxa: needs the Keysight MXA",
    "scope: needs the LeCroy oscilloscope",
    "shutter: needs the PSU / optical shutter",
    "wavemeter: needs the wavemeter server",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF", "S", "BLE", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.13.0",
    "textual-dev>=1.7.0",
]
