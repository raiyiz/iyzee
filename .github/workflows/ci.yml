name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - moonshine

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install lint dependencies
        run: python -m pip install ruff

      - name: Run Ruff check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package and type checker
        run: python -m pip install -e . mypy

      - name: Run mypy
        run: mypy src tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"
          cache-dependency-path: docs/requirements.typ

      - name: Compile Typst documentation
        run: |
          set -euo pipefail
          mkdir -p build/docs
          for source in docs/*.typ; do
            case "$source" in
              docs/requirements.typ) continue ;;
            esac
            output="build/docs/$(basename "${source%.typ}").pdf"
            typst compile "$source" "$output"
          done

      - name: Upload compiled documentation
        uses: actions/upload-artifact@v4
        with:
          name: iyzee-documentation
          path: build/docs/*.pdf
          if-no-files-found: error
          retention-days: 30
