name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - moonshine

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check:
          - test
          - lint
          - typecheck
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.19"
          python-version: "3.14"

      - name: Run check
        run: ./ci.sh ${{ matrix.check }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"
          cache-dependency-path: docs/requirements.typ

      - name: Compile documentation
        run: ./ci.sh docs

      - name: Upload compiled documentation
        uses: actions/upload-artifact@v4
        with:
          name: iyzee-documentation
          path: build/docs/*.pdf
          if-no-files-found: error
          retention-days: 30
