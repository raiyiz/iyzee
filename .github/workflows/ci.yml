name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - refab
      - cleanup/refab-consolidation
      - cleanup/refabulation

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check:
          - test
          - lint
          - typecheck
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          python-version: "3.14"

      - name: Run check
        run: ./ci.sh ${{ matrix.check }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"
          cache-dependency-path: docs/requirements.typ

      - name: Compile documentation
        run: ./ci.sh docs

      - name: Upload compiled documentation
        uses: actions/upload-artifact@v7
        with:
          name: iyzee-documentation
          path: build/docs/*.pdf
          if-no-files-found: error
          retention-days: 30
